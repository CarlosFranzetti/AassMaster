<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>aasssMaster</title>
<style>
  html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; background:#000; display:block; }
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:#000; color:#ff5fa2; font: bold 22px monospace; text-align:center; z-index:10; }
  #rotate .phone { width:40px; height:70px; border:4px solid #ff5fa2; border-radius:6px; margin-bottom:20px;
    animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,20% { transform:rotate(0deg);} 60%,100% { transform:rotate(90deg);} }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="384" height="216"></canvas></div>
<div id="rotate"><div class="phone"></div>ROTATE YOUR DEVICE<br><small>aasssMaster is a landscape game</small></div>
<script src="js/sprites.js"></script>
<script src="js/sfx.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
